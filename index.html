    function jitterData(list) {
      const delta = (v, spread, max) => {
        const d = Math.round((Math.random() * 2 - 1) * spread);
        return Math.max(0, Math.min(max, v + d));
      };
      return list.map((h) => {
        const big = h.waitAdmit > 40 ? 1.6 : 1;
        const waitAdmit = delta(h.waitAdmit, 6 * big, 120);
        const waitPush = delta(h.waitPush, 4 * big, 45);
        let fullNotified = h.fullNotified;
        if (fullNotified && waitAdmit < 60 && Math.random() < 0.25) fullNotified = false;
        if (!fullNotified && waitAdmit > 70 && Math.random() < 0.3) fullNotified = true;
        if (!fullNotified && waitAdmit <= 70 && Math.random() < 0.03) fullNotified = true;
        return {
          ...h,
          fullNotified,
          waitVisit: delta(h.waitVisit, 5 * big, 80),
          waitPush,
          waitAdmit,
          waitICU: delta(h.waitICU, 2 * big, 35),
          liveChannel: undefined,
        };
      });
    }

    const PROXY_URL = (new URLSearchParams(location.search).get("proxy") || "https://cgmh-emergency-real-time-dashboard.readyfly321go.workers.dev").replace(/\/+$/, "");
    const FETCH_TIMEOUT_MS = 12000;
    let lastGoodChannel = null;

    const parseNum = (s) => {
      const m = String(s || "").replace(/,/g, "").match(/-?\d+/);
      return m ? Math.max(0, parseInt(m[0], 10)) : 0;
    };
    const isFullYes = (s) => /^(是|有|已通報)$/.test(String(s || "").trim());

    async function fetchHtmlWithTimeout(url, timeoutMs = FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const bustUrl = url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
        const res = await fetch(bustUrl, { signal: controller.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const buffer = await res.arrayBuffer();
        try {
          const utf8Text = new TextDecoder("utf-8", { fatal: true }).decode(buffer);
          if (utf8Text.includes("急診") || utf8Text.includes("長庚") || utf8Text.includes("醫院")) {
            return utf8Text;
          }
        } catch (_) {}
        for (const label of ["big5", "big5-hkscs", "x-x-big5"]) {
          try {
            const big5Text = new TextDecoder(label).decode(buffer);
            if (big5Text.includes("急診") || big5Text.includes("長庚") || big5Text.includes("醫院") || big5Text.includes("更新時間")) {
              return big5Text;
            }
          } catch (_) {}
        }
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("手機瀏覽器 Big5 解碼失敗"));
          reader.readAsText(new Blob([buffer]), "big5");
        });
      } finally {
        clearTimeout(timer);
      }
    }

    function parseBranchHtml(html, base) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script,style,noscript").forEach((n) => n.remove());

      doc.querySelectorAll("td,th,tr,div,p,li,br,h1,h2,h3,h4,h5,h6").forEach((n) => {
        n.insertAdjacentText("beforebegin", " ");
        n.insertAdjacentText("afterend", " ");
      });

      const rawBody = doc.body ? doc.body.textContent : html.replace(/<[^>]+>/g, " ");
      const text = rawBody.replace(/臺/g, "台").replace(/\s+/g, " ").trim();
      if (!text.includes("急診") && !text.includes("人數") && !text.includes("更新時間")) {
        throw new Error("非有效急診網頁內容（回應預覽：" + text.slice(0, 30) + "）");
      }

      const tm = text.match(/(\d{4}\/\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}:\d{2})/);
      const updatedAt = tm ? tm[1] : null;

      let full = null;
      const v = { visit: null, push: null, admit: null, icu: null };
      const complete = () => Object.values(v).every((x) => x !== null);

      doc.querySelectorAll("tr").forEach((tr) => {
        const cells = Array.from(tr.children).filter((c) => /^(TD|TH)$/.test(c.tagName));
        if (cells.length < 2) return;
        const imgInfo = Array.from(cells[0].querySelectorAll("img"))
          .map((i) => [i.alt, i.title, i.getAttribute("src")].join(" "))
          .join(" ");
        const label = cells[0].textContent + " " + imgInfo;
        const value = cells[cells.length - 1].textContent.trim();
        if (label.includes("119") || label.includes("通報滿床")) full = isFullYes(value) || (full === null ? null : full);
        else if (label.includes("看診")) v.visit = parseNum(value);
        else if (label.includes("推床")) v.push = parseNum(value);
        else if (label.includes("加護")) v.icu = parseNum(value);
        else if (label.includes("住院")) v.admit = parseNum(value);
      });

      if (!complete()) {
        const kw = (k) => {
          const m = text.match(new RegExp(k + "[^0-9]{0,12}([0-9]+)"));
          return m ? parseInt(m[1], 10) : null;
        };
        const a = [kw("等待看診"), kw("等待推床"), kw("等待住院"), kw("等待加護")];
        if (a.every((x) => x !== null)) [v.visit, v.push, v.admit, v.icu] = a;
        const fm = text.match(/已向\s*119\s*通報滿床[^是否有無已未]{0,6}(是|否|有|無|已通報|未通報)/);
        if (fm && full === null) full = isFullYes(fm[1]);
      }

      if (!complete()) {
        const tail = tm ? text.slice(tm.index + tm[0].length) : text;
        const m = tail.match(/(是|否|有|無|已通報|未通報)?[^0-9]*(\d+)\s+(\d+)\s+(\d+)\s+(\d+)/);
        if (m) {
          if (m[1] && full === null) full = isFullYes(m[1]);
          v.visit = +m[2]; v.push = +m[3]; v.admit = +m[4]; v.icu = +m[5];
        }
      }

      if (!complete()) {
        const preview = text.slice(0, 80);
        throw new Error(`未偵測到急診指標欄位（實際回傳內容：「${preview}」）`);
      }

      return {
        ...base,
        fullNotified: full === null ? base.fullNotified : full,
        waitVisit: v.visit,
        waitPush: v.push,
        waitAdmit: v.admit,
        waitICU: v.icu,
        updatedAt,
      };
    }

    function buildChannels(h) {
      const loc = encodeURIComponent(h.locCode);
      const target = `${SOURCE_URL}?loc=${loc}`;
      const list = [];
      if (PROXY_URL) {
        list.push({ name: "Cloudflare代理", url: `${PROXY_URL}/?loc=${loc}` });
      }
      list.push(
        { name: "直連", url: target },
        { name: "AllOrigins", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}` },
        { name: "CodeTabs", url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}` },
        { name: "CorsProxy", url: `https://corsproxy.io/?${encodeURIComponent(target)}` }
      );
      if (lastGoodChannel) list.sort((a, b) => (b.name === lastGoodChannel) - (a.name === lastGoodChannel));
      return list;
    }

    async function fetchOneHospital(h) {
      const errors = [];
      for (const ch of buildChannels(h)) {
        try {
          const html = await fetchHtmlWithTimeout(ch.url);
          const parsed = parseBranchHtml(html, h);
          parsed.liveChannel = ch.name;
          lastGoodChannel = ch.name;
          return parsed;
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          errors.push(`${ch.name}: ${msg === "Failed to fetch" ? "被 CORS/網路擋下" : msg}`);
          if (e && e.fatal) break;
        }
      }
      throw new Error(errors.join(" ｜ "));
    }

    window.probeLocCodes = async () => {
      const codes = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const rows = [];
      for (const c of codes) {
        let result = "（無此代碼或抓取失敗）";
        for (const ch of buildChannels({ locCode: c })) {
          try {
            const html = await fetchHtmlWithTimeout(ch.url);
            const d = new DOMParser().parseFromString(html, "text/html");
            const txt = (d.body ? d.body.textContent : "").replace(/\s+/g, " ").trim();
            const m = txt.match(/^(.{2,20}?)\s*(急診)/);
            if (txt.includes("急診")) { result = m ? m[1] : txt.slice(0, 20); break; }
          } catch (_) {}
        }
        rows.push({ loc: c, 院區: result });
        await new Promise((r) => setTimeout(r, 300));
      }
      console.table(rows.filter((r) => !r.院區.startsWith("（")));
      return rows;
    };

    async function fetchRealCGMHData(baseline) {
      const settled = await Promise.allSettled(baseline.map((h) => fetchOneHospital(h)));
      let successCount = 0;
      let channelName = "";
      const failed = [];

      const list = settled.map((res, idx) => {
        if (res.status === "fulfilled") {
          successCount++;
          if (!channelName && res.value.liveChannel) channelName = res.value.liveChannel;
          return res.value;
        }
        failed.push({ name: baseline[idx].name, reason: res.reason && res.reason.message });
        console.warn(`[CGMH] ${baseline[idx].name} 失敗：`, res.reason && res.reason.message);
        return baseline[idx];
      });

      if (successCount === 0) {
        const sample = failed[0] ? `（例：${failed[0].name} → ${failed[0].reason}）` : "";
        throw new Error(
          `10 院區全部抓取失敗${sample}。瀏覽器無法直接跨網域讀取長庚網頁，請部署 worker.js 自架代理，並以 ?proxy=你的網址 開啟本頁`
        );
      }
      return { list, successCount, channelName, failed };
    }

    function getLevel(h) {
      if (h.fullNotified || h.waitAdmit > 50 || h.waitPush > 20) return "red";
      if ((h.waitAdmit >= 20 && h.waitAdmit <= 50) || h.waitVisit > 15) return "amber";
      return "green";
    }

    function getReasons(h) {
      const r = [];
      if (h.fullNotified) r.push("119 通報滿床");
      if (h.waitAdmit > 50) r.push("待住院 > 50");
      else if (h.waitAdmit >= 20) r.push("待住院 20–50");
      if (h.waitPush > 20) r.push("待推床 > 20");
      if (h.waitVisit > 15) r.push("候診 > 15");
      return r;
    }

    function loadIndex(h) {
      const raw =
        0.45 * (h.waitAdmit / 50) +
        0.25 * (h.waitPush / 20) +
        0.2 * (h.waitVisit / 30) +
        0.1 * (h.waitICU / 20);
      let v = Math.round(Math.min(raw, 1.2) * 83);
      if (h.fullNotified) v = Math.max(v, 90);
      return Math.min(100, v);
    }

    function metricTone(key, h) {

        if (h.waitAdmit > 50) return "red";
        if (h.waitAdmit >= 20) return "amber";

      if (key === "waitPush" && h.waitPush > 20) return "red";

    const TONE_TEXT = { red: "text-red-600", amber: "text-amber-600", normal: "text-slate-800" };

    const ECG_PATH = (() => {
      let d = "M0 30";
      for (let i = 0; i < 3; i++) {

    function Trend({ delta }) {

    function Gauge({ value, color, size = 64 }) {
      const stroke = 6;
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      return (
        <div className="relative shrink-0" style={{ width: size, height: size }} title="壅塞指數(自訂估算)">
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#e2e8f0" strokeWidth={stroke} />

              cx={size / 2}
              cy={size / 2}
              r={r}
              fill="none"
              stroke={color}
              strokeWidth={stroke}
              strokeLinecap="round"
              strokeDasharray={c}

    function MetricBar({ metric, h, delta }) {
      const tone = metricTone(metric.key, h);

      const Icon = metric.Icon;
      return (

            <span className="flex items-baseline gap-1">

              <span className={`text-2xl font-extrabold leading-none tabular-nums ${TONE_TEXT[tone]}`}>{v}</span>

          <div className="relative mt-1.5 h-1.5 rounded-full bg-slate-100">
            <div className={`bar-fill h-full rounded-full ${TONE_BAR[tone]}`} style={{ width: `${pct}%` }} />
            {metric.ticks.map((t) => (
              <span
                key={t}
                className="absolute -top-0.5 h-2.5 w-px bg-slate-400/70"
                style={{ left: `${(t / metric.max) * 100}%` }}

    }

    const deltaOf = (prev, h, k) => (prev[h.id] ? h[k] - prev[h.id][k] : null);

    function HospitalCard({ h, prev, index }) {

              <div className="mt-0.5 flex items-center gap-1.5 text-[11px] text-slate-400">

                <span>·</span>
                <a

    function MiniBar({ value, max, tone }) {

    function HospitalTable({ list, prev }) {

    function InteractiveLoadChart({ data, stacked }) {
      const [hoverIdx, setHoverIdx] = useState(null);

      const maxVal = useMemo(() => {
        if (!data.length) return 100;
        if (stacked) {
          const maxSum = Math.max(...data.map((d) => d.waitVisit + d.waitPush + d.waitAdmit + d.waitICU), 40);
          return Math.ceil(maxSum / 40) * 40;
        } else {
          const maxSingle = Math.max(...data.flatMap((d) => [d.waitVisit, d.waitPush, d.waitAdmit, d.waitICU]), 20);
          return Math.ceil(maxSingle / 20) * 20;
        }
      }, [data, stacked]);

      const ticks = useMemo(() => {
        const step = maxVal / 4;
        return [maxVal, step * 3, step * 2, step, 0];
      }, [maxVal]);

      return (
        <div className="flex h-[380px] w-full flex-col select-none">
          <div className="relative flex flex-1 pt-4 pb-2">
            <div className="flex w-12 shrink-0 flex-col justify-between pr-2 text-right text-xs text-slate-500">
              {ticks.map((t) => (
                <span key={t} className="leading-none tabular-nums">{Math.round(t)}人</span>
              ))}
            </div>

            <div className="relative flex flex-1 items-end border-b border-slate-300">
              <div className="pointer-events-none absolute inset-0 flex flex-col justify-between">
                {ticks.map((t, idx) => (
                  <div
                    key={t}
                    className={`w-full ${idx === ticks.length - 1 ? "" : "border-t border-dashed border-slate-200"}`}
                  />
                ))}
              </div>

              <div className="relative z-10 flex h-full w-full items-end justify-around px-1">
                {data.map((h, i) => {
                  const total = h.waitVisit + h.waitPush + h.waitAdmit + h.waitICU;
                  const isHovered = hoverIdx === i;

                  return (
                    <div
                      key={h.id}
                      onMouseEnter={() => setHoverIdx(i)}
                      onMouseLeave={() => setHoverIdx(null)}
                      className={`relative flex h-full flex-1 flex-col items-center justify-end px-1 transition-colors rounded-t-lg ${
                        isHovered ? "bg-teal-500/[0.08]" : ""
                      }`}
                    >
                      {isHovered && (
                        <div
                          className={`pointer-events-none absolute bottom-full mb-2 z-30 min-w-[155px] rounded-xl border border-slate-200 bg-white/95 p-3 text-xs shadow-xl backdrop-blur ${
                            i > data.length - 3 ? "right-0" : i < 2 ? "left-0" : "left-1/2 -translate-x-1/2"
                          }`}
                        >
                          <div className="mb-1.5 border-b border-slate-100 pb-1.5 text-sm font-bold text-slate-900">
                            {h.name}
                          </div>
                          {METRICS.map((m) => (
                            <div key={m.key} className="flex items-center justify-between gap-4 py-0.5">
                              <span className="flex items-center gap-1.5 text-slate-600">
                                <span className="h-2 w-2 rounded-sm" style={{ background: m.color }} />
                                {m.label}
                              </span>
                              <span className="font-bold tabular-nums text-slate-900">{h[m.key]} 人</span>
                            </div>
                          ))}
                          <div className="mt-1.5 flex justify-between border-t border-slate-100 pt-1.5 font-semibold text-slate-700">
                            <span>合計</span>
                            <span className="tabular-nums">{total} 人</span>
                          </div>
                        </div>
                      )}

                      {stacked ? (
                        <div className="flex w-full max-w-[42px] flex-col-reverse overflow-hidden rounded-t-md h-full justify-start">
                          {METRICS.map((m) => {
                            const hPct = Math.max(0, (h[m.key] / maxVal) * 100);
                            return (
                              <div
                                key={m.key}
                                className="bar-fill w-full"
                                style={{
                                  height: `${hPct}%`,
                                  background: `linear-gradient(180deg, ${m.color} 0%, ${m.color}cc 100%)`,
                                }}
                              />
                            );
                          })}
                        </div>
                      ) : (
                        <div className="flex h-full w-full max-w-[56px] items-end justify-center gap-0.5">
                          {METRICS.map((m) => {
                            const hPct = Math.max(0, (h[m.key] / maxVal) * 100);
                            return (
                              <div
                                key={m.key}
                                className="bar-fill flex-1 rounded-t-sm"
                                style={{
                                  height: `${hPct}%`,
                                  background: `linear-gradient(180deg, ${m.color} 0%, ${m.color}bb 100%)`,
                                }}
                              />
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="flex pl-12 pt-1.5">
            {data.map((h) => (
              <div key={h.id} className="flex-1 truncate text-center text-[11px] sm:text-xs font-semibold text-slate-600">
                {h.name}
              </div>
            ))}
          </div>

          <div className="mt-3 flex flex-wrap items-center justify-center gap-5 text-xs font-medium text-slate-600">
            {METRICS.map((m) => (
              <span key={m.key} className="inline-flex items-center gap-1.5">
                <span className="h-2.5 w-2.5 rounded-full" style={{ background: m.color }} />
                {m.label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    function CountdownRing({ seconds, total }) {
      const r = 15;
      const c = 2 * Math.PI * r;
      const pct = Math.max(0, seconds) / total;
      return (
        <svg width="38" height="38" className="-rotate-90">
          <circle cx="19" cy="19" r={r} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="3" />
          <circle
            cx="19"
            cy="19"
            r={r}
            fill="none"
            stroke="#2dd4bf"
            strokeWidth="3"
            strokeLinecap="round"
            strokeDasharray={c}
            strokeDashoffset={c * (1 - pct)}
            style={{ transition: "stroke-dashoffset 1s linear" }}
          />
        </svg>
      );
    }

    function Gauge2() {
      return <GaugeIcon className="h-4 w-4 text-teal-600" />;
    }

    const fmtDateTime = (d) =>
      d.toLocaleString("zh-TW", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });

    function App() {
      const [data, setData] = useState(MOCK_BASE);
      const [prev, setPrev] = useState({});
      const [liveMode, setLiveMode] = useState(true);
      const [liveInfo, setLiveInfo] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastUpdate, setLastUpdate] = useState(new Date());
      const [now, setNow] = useState(new Date());
      const [countdown, setCountdown] = useState(REFRESH_SECONDS);
      const [regionFilter, setRegionFilter] = useState("all");
      const [sortMode, setSortMode] = useState("default");
      const [viewMode, setViewMode] = useState("grid");
      const [stacked, setStacked] = useState(true);

      const dataRef = useRef(data);
      dataRef.current = data;

      const refresh = useCallback(async (live) => {
        setLoading(true);
        setError(null);
        try {
          if (live) {
            const res = await fetchRealCGMHData(dataRef.current);
            setPrev(Object.fromEntries(dataRef.current.map((h) => [h.id, h])));
            setData(res.list);
            setLiveInfo(`${res.channelName} · ${res.successCount}/10 院區`);
            setLastUpdate(new Date());
          } else {
            await new Promise((r) => setTimeout(r, 400));
            const next = jitterData(dataRef.current);
            setPrev(Object.fromEntries(dataRef.current.map((h) => [h.id, h])));
            setData(next);
            setLiveInfo(null);
            setLastUpdate(new Date());
          }
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          setLiveInfo(null);
          setError(`即時資料串接提示：${msg}。已保留目前畫面資料供檢視。`);
        } finally {
          setLoading(false);
          setCountdown(REFRESH_SECONDS);
        }
      }, []);

      useEffect(() => {
        const t = setInterval(() => {
          setNow(new Date());
          setCountdown((c) => c - 1);
        }, 1000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        refresh(true);
      }, [refresh]);

      useEffect(() => {
        if (countdown <= 0) {
          setCountdown(REFRESH_SECONDS);
          refresh(liveMode);
        }
      }, [countdown, liveMode, refresh]);

      const toggleMode = () => {
        const next = !liveMode;
        setLiveMode(next);
        if (next) refresh(true);
        else {
          setError(null);
          setLiveInfo(null);
          setCountdown(REFRESH_SECONDS);
        }
      };

      const kpi = useMemo(() => {
        const topOf = (k) => [...data].sort((a, b) => b[k] - a[k])[0];
        const fullList = data.filter((h) => h.fullNotified);
        return {
          fullList,
          admit: data.reduce((s, h) => s + h.waitAdmit, 0),
          push: data.reduce((s, h) => s + h.waitPush, 0),
          icu: data.reduce((s, h) => s + h.waitICU, 0),
          visit: data.reduce((s, h) => s + h.waitVisit, 0),
          red: data.filter((h) => getLevel(h) === "red").length,
          amber: data.filter((h) => getLevel(h) === "amber").length,
          green: data.filter((h) => getLevel(h) === "green").length,
          avgLoad: Math.round(data.reduce((s, h) => s + loadIndex(h), 0) / data.length),
          topAdmit: topOf("waitAdmit"),
          topPush: topOf("waitPush"),
          topIcu: topOf("waitICU"),
        };
      }, [data]);

      const visible = useMemo(() => {
        let list = data.filter((h) => {
          if (regionFilter === "all") return true;
          if (regionFilter === "full") return h.fullNotified;
          return h.region === regionFilter;
        });
        if (sortMode === "admit") list = [...list].sort((a, b) => b.waitAdmit - a.waitAdmit);
        if (sortMode === "push") list = [...list].sort((a, b) => b.waitPush - a.waitPush);
        return list;
      }, [data, regionFilter, sortMode]);

      const ranking = useMemo(() => [...visible].sort((a, b) => loadIndex(b) - loadIndex(a)), [visible]);

      const mm = String(Math.floor(Math.max(countdown, 0) / 60)).padStart(2, "0");
      const ss = String(Math.max(countdown, 0) % 60).padStart(2, "0");

      const chip = (active) =>
        `inline-flex items-center gap-1 rounded-full px-3.5 py-1.5 text-sm font-semibold transition ${
          active
            ? "bg-slate-900 text-white shadow-md shadow-slate-900/20"
            : "bg-slate-100 text-slate-600 hover:bg-slate-200"
        }`;

      const seg = (active) =>
        `inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-semibold transition ${
          active ? "bg-teal-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"
        }`;

      const tickerNames = kpi.fullList.map((h) => h.name).join("、");

      return (
        <div className="med-grid min-h-screen bg-slate-50 text-slate-800">
          {/* ===== Header 指揮中心 ===== */}
          <header className="relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-teal-950 text-white shadow-lg">
            <EcgBackdrop />
            <div className="relative mx-auto flex max-w-[1800px] flex-wrap items-center justify-between gap-4 px-4 py-4">
              <div className="flex items-center gap-3.5">
                <div className="relative flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-400 to-emerald-600 shadow-lg shadow-teal-500/30">
                  <Cross className="h-7 w-7 text-white" strokeWidth={3} />
                  <span className="absolute -right-1 -top-1 flex h-3.5 w-3.5">
                    <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-300 opacity-75" />
                    <span className="relative inline-flex h-3.5 w-3.5 rounded-full border-2 border-slate-900 bg-emerald-400" />
                  </span>
                </div>
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <h1 className="text-xl font-extrabold tracking-tight sm:text-2xl">長庚醫療體系 · 急診即時監控中心</h1>
                    <span
                      className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-black tracking-widest ${
                        liveMode && liveInfo ? "bg-emerald-500 text-white" : liveMode ? "bg-red-500 text-white" : "bg-amber-400/90 text-slate-900"
                      }`}
                    >
                      <Radio className="h-3 w-3" />
                      {liveMode ? (liveInfo ? `LIVE (${liveInfo})` : "LIVE") : "DEMO"}
                    </span>
                  </div>
                  <div className="mt-0.5 flex flex-wrap items-center gap-x-3 text-xs text-slate-400">
                    <span className="tracking-wider">CGMH EMERGENCY · REAL-TIME DASHBOARD</span>
                    <a
                      href={SOURCE_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center gap-1 text-teal-300 hover:text-teal-200 hover:underline"
                    >
                      資料來源:長庚急診即時訊息 <ExternalLink className="h-3 w-3" />
                    </a>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="rounded-xl bg-white/5 px-3 py-1.5 ring-1 ring-white/10 backdrop-blur">
                  <div className="flex items-center gap-1 text-[10px] font-semibold uppercase tracking-widest text-slate-400">
                    <Clock className="h-3 w-3" /> 現在時間
                  </div>
                  <div className="font-mono text-lg font-bold leading-tight tabular-nums text-teal-200">
                    {now.toLocaleTimeString("zh-TW", { hour12: false })}
                  </div>
                </div>

                <div className="rounded-xl bg-white/5 px-3 py-1.5 ring-1 ring-white/10 backdrop-blur">
                  <div className="text-[10px] font-semibold uppercase tracking-widest text-slate-400">最後更新</div>
                  <div className="font-mono text-sm font-semibold leading-tight tabular-nums text-slate-100">
                    {fmtDateTime(lastUpdate)}
                  </div>
                </div>

                <div className="flex items-center gap-2 rounded-xl bg-white/5 px-3 py-1 ring-1 ring-white/10 backdrop-blur">
                  <div className="relative">
                    <CountdownRing seconds={countdown} total={REFRESH_SECONDS} />
                    <Timer className="absolute inset-0 m-auto h-4 w-4 text-teal-300" />
                  </div>
                  <div>
                    <div className="text-[10px] font-semibold uppercase tracking-widest text-slate-400">下次自動更新</div>
                    <div className="font-mono text-lg font-bold leading-tight tabular-nums">
                      {mm}:{ss}
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => refresh(liveMode)}
                  disabled={loading}
                  className="inline-flex items-center gap-2 rounded-xl bg-gradient-to-b from-teal-400 to-teal-600 px-4 py-2.5 text-sm font-bold text-white shadow-lg shadow-teal-600/30 transition hover:from-teal-300 hover:to-teal-500 active:scale-95 disabled:opacity-60"
                >
                  <RefreshCw className={`h-4 w-4 ${loading ? "animate-spin" : ""}`} />
                  {loading ? "更新中…" : "立即手動更新"}
                </button>

                <button
                  onClick={toggleMode}
                  role="switch"
                  aria-checked={liveMode}
                  title="切換擬真展示數據 / 嘗試串接即時資料"
                  className="flex items-center gap-2.5 rounded-xl bg-white/5 px-3 py-2 text-sm ring-1 ring-white/10 backdrop-blur transition hover:bg-white/10"
                >
                  {liveMode ? <Wifi className="h-4 w-4 text-teal-300" /> : <WifiOff className="h-4 w-4 text-slate-400" />}
                  <span className="font-semibold">{liveMode ? "嘗試串接即時資料" : "擬真展示數據"}</span>
                  <span className={`relative h-5 w-9 rounded-full transition ${liveMode ? "bg-teal-500" : "bg-slate-600"}`}>
                    <span
                      className={`absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all ${
                        liveMode ? "left-[18px]" : "left-0.5"
                      }`}
                    />
                  </span>
                </button>
              </div>
            </div>
          </header>

          {/* ===== 緊急公告列 ===== */}
          {kpi.fullList.length > 0 ? (
            <div className="hazard-stripes overflow-hidden bg-red-600 text-white shadow">
              <div className="mx-auto flex max-w-[1800px] items-center gap-3 px-4 py-2">
                <span className="flex shrink-0 items-center gap-1.5 rounded bg-white px-2 py-0.5 text-xs font-black tracking-wider text-red-600">
                  <BellRing className="h-3.5 w-3.5 animate-pulse" /> 緊急
                </span>
                <div className="relative min-w-0 flex-1 overflow-hidden">
                  <div className="marquee-track flex w-max whitespace-nowrap text-sm font-semibold">
                    {[0, 1].map((i) => (
                      <span key={i} className="pr-16">
                        🚨 {tickerNames} 已向 119 通報急診滿床,建議非危急民眾分流至鄰近院區就醫 ・ 全體系目前 {kpi.red} 個院區處於危急壅塞
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="bg-emerald-600 text-white">
              <div className="mx-auto flex max-w-[1800px] items-center gap-2 px-4 py-1.5 text-sm font-semibold">
                <ShieldCheck className="h-4 w-4" /> 目前無任何院區通報 119 滿床,全體系急診運作中
              </div>
            </div>
          )}

          <main className="mx-auto max-w-[1800px] space-y-5 px-4 py-5">
            {error && (
              <div className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">
                <div className="flex items-start gap-2">
                  <AlertTriangle className="mt-0.5 h-4 w-4 shrink-0" />
                  <span>{error}</span>
                </div>
                <button
                  onClick={() => refresh(liveMode)}
                  className="shrink-0 rounded-lg bg-amber-600 px-3 py-1 text-xs font-bold text-white hover:bg-amber-700"
                >
                  重新嘗試連線 ↻
                </button>
              </div>
            )}
            {!liveMode && (
              <div className="flex items-start gap-2 rounded-xl border border-sky-200 bg-sky-50/80 px-3 py-2 text-xs text-sky-800">
                <Info className="mt-0.5 h-3.5 w-3.5 shrink-0" />
                目前為「擬真展示數據」模式:數字為模擬資料,每次更新會在合理範圍內隨機微調,非真實醫院資訊。點擊右上角「擬真展示數據」開關可切換為即時連線模式。
              </div>
            )}

            {/* ===== KPI ===== */}
            <section className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              <KpiCard
                label="目前通報 119 滿床院區數"
                value={kpi.fullList.length}
                unit="/ 10 院區"
                Icon={Siren}
                critical={kpi.fullList.length > 0}
                accent={kpi.fullList.length > 0 ? { bar: "bg-red-500", icon: "text-red-600" } : { bar: "bg-emerald-500", icon: "text-emerald-600" }}
                hint={kpi.fullList.length ? kpi.fullList.map((h) => h.name).join("、") : "全體系皆可正常收治"}
              />
              <KpiCard
                label="全體系總等待住院人數"
                value={kpi.admit}
                unit="人"
                Icon={Users}
                accent={{ bar: "bg-rose-500", icon: "text-rose-600" }}
                hint={`最多:${kpi.topAdmit.name} ${kpi.topAdmit.waitAdmit} 人`}
              />
              <KpiCard
                label="全體系總等待推床人數"
                value={kpi.push}
                unit="人"
                Icon={BedDouble}
                accent={{ bar: "bg-amber-500", icon: "text-amber-600" }}
                hint={`最多:${kpi.topPush.name} ${kpi.topPush.waitPush} 人`}
              />
              <KpiCard
                label="全體系總等待加護人數"
                value={kpi.icu}
                unit="人"
                Icon={HeartPulse}
                accent={{ bar: "bg-violet-500", icon: "text-violet-600" }}
                hint={`最多:${kpi.topIcu.name} ${kpi.topIcu.waitICU} 人`}
              />
            </section>

            {/* ===== 體系狀態分布 ===== */}
            <section className="fade-up flex flex-wrap items-center gap-x-6 gap-y-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
              <div className="flex items-center gap-2 text-sm font-bold text-slate-700">
                <Gauge2 /> 體系壅塞分布
              </div>
              <div className="flex h-3 min-w-[200px] flex-1 overflow-hidden rounded-full bg-slate-100">
                <div className="bar-fill bg-red-500" style={{ width: `${kpi.red * 10}%` }} />
                <div className="bar-fill bg-amber-400" style={{ width: `${kpi.amber * 10}%` }} />
                <div className="bar-fill bg-emerald-500" style={{ width: `${kpi.green * 10}%` }} />
              </div>
              <div className="flex flex-wrap items-center gap-4 text-xs font-semibold">
                <span className="inline-flex items-center gap-1.5 text-red-600">
                  <span className="h-2.5 w-2.5 rounded-full bg-red-500" /> 危急 {kpi.red}
                </span>
                <span className="inline-flex items-center gap-1.5 text-amber-600">
                  <span className="h-2.5 w-2.5 rounded-full bg-amber-400" /> 警戒 {kpi.amber}
                </span>
                <span className="inline-flex items-center gap-1.5 text-emerald-600">
                  <span className="h-2.5 w-2.5 rounded-full bg-emerald-500" /> 正常 {kpi.green}
                </span>
                <span className="border-l border-slate-200 pl-4 text-slate-500">
                  全體系候診 <b className="text-slate-800">{kpi.visit}</b> 人
                </span>
                <span className="text-slate-500">
                  平均壅塞指數 <b className="text-slate-800">{kpi.avgLoad}</b>
                </span>
              </div>
            </section>

            {/* ===== 篩選與控制 ===== */}
            <section className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
              <div className="flex flex-wrap items-center gap-2">
                <Filter className="h-4 w-4 text-slate-400" />
                {[
                  ["all", "全部"],
                  ["north", "北區"],
                  ["south", "中南區"],
                  ["full", "僅顯示滿床院區"],
                ].map(([k, label]) => (
                  <button key={k} onClick={() => setRegionFilter(k)} className={chip(regionFilter === k)}>
                    {k === "full" && <Siren className={`h-3.5 w-3.5 ${regionFilter === k ? "text-red-300" : "text-red-500"}`} />}
                    {label}
                    {k === "full" && kpi.fullList.length > 0 && (
                      <span className="ml-0.5 rounded-full bg-red-500 px-1.5 text-[10px] font-bold text-white">{kpi.fullList.length}</span>
                    )}
                  </button>
                ))}
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2">
                  <ArrowUpDown className="h-4 w-4 text-slate-400" />
                  <select
                    value={sortMode}
                    onChange={(e) => setSortMode(e.target.value)}
                    className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500"
                  >
                    <option value="default">預設院區順序</option>
                    <option value="admit">等待住院人數 高 → 低</option>
                    <option value="push">等待推床人數 高 → 低</option>
                  </select>
                </div>

                <div className="flex overflow-hidden rounded-lg ring-1 ring-slate-200">
                  <button onClick={() => setViewMode("grid")} className={seg(viewMode === "grid")}>
                    <LayoutGrid className="h-4 w-4" />
                    卡片網格
                  </button>
                  <button onClick={() => setViewMode("table")} className={seg(viewMode === "table")}>
                    <Table2 className="h-4 w-4" />
                    緊湊表格
                  </button>
                </div>
              </div>
            </section>

            {/* ===== 警示規則 ===== */}
            <div className="flex flex-wrap items-center gap-x-5 gap-y-1.5 text-xs text-slate-500">
              <span className="font-bold text-slate-600">警示分級:</span>
              <span className="inline-flex items-center gap-1.5">
                <span className="rounded bg-red-600 px-1.5 py-0.5 text-[10px] font-bold text-white">危急</span>
                通報滿床、待住院 &gt; 50、待推床 &gt; 20
              </span>
              <span className="inline-flex items-center gap-1.5">
                <span className="rounded bg-amber-500 px-1.5 py-0.5 text-[10px] font-bold text-white">警戒</span>
                待住院 20~50、候診 &gt; 15
              </span>
              <span className="inline-flex items-center gap-1.5">
                <span className="rounded bg-emerald-600 px-1.5 py-0.5 text-[10px] font-bold text-white">正常</span>
                未達上述標準
              </span>
              <span className="inline-flex items-center gap-1.5 text-slate-400">
                <span className="h-2.5 w-px bg-slate-400" /> 進度條刻度 = 警示閾值 ・ 數字旁箭頭 = 與上次更新差異
              </span>
            </div>

            {/* ===== 主視覺區 ===== */}
            {visible.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-300 bg-white py-16 text-center text-slate-500">
                <CheckCircle2 className="mx-auto mb-2 h-10 w-10 text-emerald-500" />
                目前沒有符合條件的院區(太好了,沒有任何院區通報滿床)
              </div>
            ) : viewMode === "grid" ? (
              <section className="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
                {visible.map((h, i) => (
                  <HospitalCard key={h.id} h={h} prev={prev} index={i} />
                ))}
              </section>
            ) : (
              <HospitalTable list={visible} prev={prev} />
            )}

            {/* ===== 圖表 ===== */}
            <section className="grid grid-cols-1 gap-4 xl:grid-cols-3">
              <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm xl:col-span-2">
                <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="flex items-center gap-2 text-base font-extrabold text-slate-900">
                      <Activity className="h-5 w-5 text-teal-600" />
                      各院區急診負荷量對比
                    </h2>
                    <p className="text-xs text-slate-500">等待看診 / 推床 / 住院 / 加護四項人數(依上方篩選與排序顯示，滑鼠移至長條可檢視明細)</p>
                  </div>
                  <div className="flex overflow-hidden rounded-lg text-sm ring-1 ring-slate-200">
                    <button onClick={() => setStacked(true)} className={seg(stacked)}>
                      堆疊
                    </button>
                    <button onClick={() => setStacked(false)} className={seg(!stacked)}>
                      分組
                    </button>
                  </div>
                </div>
                <InteractiveLoadChart data={visible} stacked={stacked} />
              </div>

              {/* 壅塞排行 */}
              <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <h2 className="flex items-center gap-2 text-base font-extrabold text-slate-900">
                  <TrendingUp className="h-5 w-5 text-rose-500" />
                  壅塞指數排行
                </h2>
                <p className="mb-3 text-xs text-slate-500">綜合住院、推床、候診與加護人數估算(0–100,非官方指標)</p>
                <ol className="space-y-2.5">
                  {ranking.map((h, i) => {
                    const st = LEVEL_STYLE[getLevel(h)];
                    const v = loadIndex(h);
                    return (
                      <li key={h.id} className="flex items-center gap-3">
                        <span
                          className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-black ${
                            i < 3 ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500"
                          }`}
                        >
                          {i + 1}
                        </span>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center justify-between text-sm">
                            <span className="flex items-center gap-1.5 font-bold text-slate-800">
                              {h.name}
                              {h.fullNotified && <Siren className="h-3.5 w-3.5 animate-pulse text-red-500" />}
                            </span>
                            <span className="font-extrabold tabular-nums" style={{ color: st.hex }}>
                              {v}
                            </span>
                          </div>
                          <div className="mt-1 h-1.5 rounded-full bg-slate-100">
                            <div className="bar-fill h-full rounded-full" style={{ width: `${v}%`, background: st.hex }} />
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ol>
              </div>
            </section>

            <footer className="space-y-1.5 pb-24 pt-3 text-center text-xs leading-relaxed text-slate-500">
              <p className="font-semibold text-slate-600">
                © 2026 長庚醫療體系急診即時訊息整合監控中心 ｜ 版權所有 · All Rights Reserved
              </p>
              <p className="text-slate-400">
                本面板為資訊整合示範，非長庚醫療財團法人官方產品。資料以
                <a href={SOURCE_URL} target="_blank" rel="noreferrer" className="mx-1 text-teal-700 hover:underline">
                  官方網站
                </a>
                公布為準；緊急傷病請直接撥打 119。
              </p>
            </footer>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
